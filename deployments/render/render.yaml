# Render.com Blueprint for TILLU Backend
# Deploys: Gateway, Engine (n8n), Daemon as separate services

services:
  # ═══════════════════════════════════════════════════════════════
  # TILLU GATEWAY - Primary API
  # ═══════════════════════════════════════════════════════════════
  - type: web
    name: tillu-gateway
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      # Secrets (set via Render dashboard)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
    healthCheckPath: /api/v1/health

  # ═══════════════════════════════════════════════════════════════
  # TILLU ENGINE - n8n Self-Hosted
  # ═══════════════════════════════════════════════════════════════
  - type: web
    name: tillu-engine
    runtime: docker
    plan: free
    autoDeploy: false
    dockerfilePath: ./deployments/render/Dockerfile.n8n
    envVars:
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        sync: false
      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: WEBHOOK_URL
        value: https://tillu-engine.onrender.com
      - key: TILLU_GATEWAY_URL
        value: https://tillu-gateway.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  # ═══════════════════════════════════════════════════════════════
  # TILLU DAEMON - Background Process
  # ═══════════════════════════════════════════════════════════════
  - type: worker
    name: tillu-daemon
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m daemon.core"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # ═══════════════════════════════════════════════════════════════
  # TILLU SEARCH - SearXNG
  # ═══════════════════════════════════════════════════════════════
  - type: web
    name: tillu-search
    runtime: docker
    plan: free
    autoDeploy: false
    dockerfilePath: ./deployments/render/Dockerfile.searxng
    envVars:
      - key: INSTANCE_NAME
        value: tillu-search
      - key: BASE_URL
        value: https://tillu-search.onrender.com
    healthCheckPath: /healthz

  # ═══════════════════════════════════════════════════════════════
  # TILLU SCRAPER - Playwright Service
  # ═══════════════════════════════════════════════════════════════
  - type: web
    name: tillu-scraper
    runtime: docker
    plan: free
    autoDeploy: false
    dockerfilePath: ./deployments/render/Dockerfile.playwright
    envVars:
      - key: PORT
        value: 3001
    healthCheckPath: /health

# ═══════════════════════════════════════════════════════════════════
# CRON JOBS - Keepalive Ring
# ═══════════════════════════════════════════════════════════════════
jobs:
  - name: keepalive-gateway
    type: cron
    runtime: python
    plan: free
    schedule: "*/5 * * * *"  # Every 5 minutes
    buildCommand: "pip install httpx"
    startCommand: "python -c \"import httpx; httpx.get('https://tillu-gateway.onrender.com/api/v1/health', timeout=30)\""

  - name: keepalive-engine
    type: cron
    runtime: python
    plan: free
    schedule: "*/10 * * * *"  # Every 10 minutes
    buildCommand: "pip install httpx"
    startCommand: "python -c \"import httpx; httpx.get('https://tillu-engine.onrender.com/healthz', timeout=30)\""

  - name: keepalive-search
    type: cron
    runtime: python
    plan: free
    schedule: "*/10 * * * *"
    buildCommand: "pip install httpx"
    startCommand: "python -c \"import httpx; httpx.get('https://tillu-search.onrender.com/healthz', timeout=30)\""
