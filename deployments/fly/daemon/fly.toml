# TILLU Daemon — Fly.io Configuration
# =====================================
# Worker process — no HTTP port, runs forever.
# Free tier: shared-cpu-1x, 256MB RAM

app = "tillu-daemon"
primary_region = "bom"  # Mumbai — closest to NCR/Delhi

[build]
  dockerfile = "Dockerfile"

# Machine config — smallest free tier
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1

# Environment variables (non-secret)
[env]
  APP_ENV = "production"
  DEBUG = "false"
  LOG_LEVEL = "INFO"
  TZ = "Asia/Kolkata"
  PYTHONUNBUFFERED = "1"

# Secrets set via: fly secrets set KEY=value
# Required secrets:
#   SUPABASE_URL
#   SUPABASE_KEY
#   SUPABASE_SERVICE_KEY
#   REDIS_URL
#   GROQ_API_KEY
#   HF_TOKEN
#   SECRET_KEY
#   SUPABASE_JWT_SECRET

# No HTTP service — daemon is a pure background worker
